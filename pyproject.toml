[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "commander-deck-ai"
version = "0.1.0"
description = "Non-LLM Commander deck recommendation and optimization"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1,<2",
  "httpx>=0.27,<1",
  "orjson>=3,<4",
  "pyarrow>=17",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ml = [
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
]
optimizer = [
  "ortools>=9,<10",
]

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "jsonschema[format]>=4,<5",
  "mypy>=1,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
cda = "commander_ai.cli.main:app"

[tool.uv]
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
packages = ["src/commander_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
