name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --group dev --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=commander_ai --cov-report=term-missing
      - name: Validate schemas and examples
        run: uv run python scripts/validate_examples.py
      - name: Validate linked fixture consistency
        run: uv run python scripts/validate_fixture_consistency.py
      - name: Enforce architecture boundaries
        run: uv run python scripts/check_architecture.py
      - name: Enforce file-size policy
        run: uv run python scripts/check_file_sizes.py
